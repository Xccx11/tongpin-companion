name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 已就绪），
      # 缺失的 platform 会由 AGP 自动补装；因此不再使用 android-actions/setup-android
      # （它的 v3 目标 Node 20，已被 runner 强制升级到 Node 24 而失效）。

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: docs/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore